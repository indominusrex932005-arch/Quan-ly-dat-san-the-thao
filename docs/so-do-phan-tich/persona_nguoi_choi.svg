<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1035" viewBox="0 0 2240 1035"><rect width="100%" height="100%" fill="white"/><text x="1120.0" y="64" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#111">BẢNG PERSONA — NGƯỜI CHƠI</text><text x="1120.0" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#111">Hệ thống quản lý đặt sân thể thao</text><rect x="70" y="150" width="2100" height="95" fill="#f1f1f1"/><text x="96" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Nhóm người dùng</text><text x="476" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Hành vi hiện tại</text><text x="1116" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Khó khăn</text><text x="1616" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Nhu cầu</text><line x1="70" y1="245" x2="2170" y2="245" stroke="#111" stroke-width="1.8"/><text x="96" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Muốn đặt nhanh</text><text x="476" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Nhắn Zalo, Fanpage hoặc dùng ứng dụng;</text><text x="476" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">xem giá và lịch trước khi đặt.</text><text x="1116" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Phải chờ chủ sân phản hồi.</text><text x="1616" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Biết lịch trống và giá rõ ràng; nhận</text><text x="1616" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">xác nhận nhanh.</text><line x1="70" y1="383" x2="2170" y2="383" stroke="#111" stroke-width="1.8"/><text x="96" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Cần sự linh hoạt</text><text x="476" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Gọi điện hoặc nhắn trực tiếp để chắc chắn</text><text x="476" y="479" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">có sân.</text><text x="1116" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Từng gặp trùng lịch hoặc khó</text><text x="1116" y="479" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">đổi, hủy.</text><text x="1616" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Đặt đúng lịch; chính sách đổi, hủy và</text><text x="1616" y="479" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">hoàn tiền rõ ràng.</text><line x1="70" y1="521" x2="2170" y2="521" stroke="#111" stroke-width="1.8"/><text x="96" y="574" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Quen dịch vụ chuyên</text><text x="96" y="617" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">nghiệp</text><text x="476" y="574" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Đặt sớm, thanh toán 100% và nhận xác</text><text x="476" y="617" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">nhận điện tử.</text><text x="1116" y="574" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Muốn tìm sân phù hợp thuận</text><text x="1116" y="617" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">tiện hơn.</text><text x="1616" y="574" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Xem vị trí, giờ trống và thông tin đơn</text><text x="1616" y="617" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">đầy đủ.</text><line x1="70" y1="659" x2="2170" y2="659" stroke="#111" stroke-width="1.8"/><text x="96" y="712" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Quen cách truyền</text><text x="96" y="755" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">thống</text><text x="476" y="712" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Gọi điện hoặc đến quầy; có nơi cho trả tiền</text><text x="476" y="755" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">tại quầy.</text><text x="1116" y="712" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Ngại thao tác công nghệ phức</text><text x="1116" y="755" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">tạp.</text><text x="1616" y="712" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Quy trình ít bước, dễ hiểu và có hướng</text><text x="1616" y="755" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">dẫn rõ ràng.</text><line x1="70" y1="797" x2="2170" y2="797" stroke="#111" stroke-width="1.8"/><rect x="70" y="150" width="2100" height="647" fill="none" stroke="#111" stroke-width="2.4"/><line x1="450" y1="150" x2="450" y2="797" stroke="#111" stroke-width="1.8"/><line x1="1090" y1="150" x2="1090" y2="797" stroke="#111" stroke-width="1.8"/><line x1="1590" y1="150" x2="1590" y2="797" stroke="#111" stroke-width="1.8"/><text x="70" y="855" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#111">Nguồn: Tổng hợp từ bảng persona được cung cấp; cần đối chiếu phiếu khảo sát gốc.</text><text x="70" y="903" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="#111">Lưu ý: Thói quen khảo sát không thay chính sách website: thanh toán trước 100% để xác nhận đặt sân.</text><text x="70" y="951" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#111">Đây là mô tả người dùng và nhu cầu; không đồng nghĩa mọi mong muốn đều thuộc phạm vi triển khai.</text></svg>