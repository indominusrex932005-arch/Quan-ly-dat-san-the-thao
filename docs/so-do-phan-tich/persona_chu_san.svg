<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="759" viewBox="0 0 2240 759"><rect width="100%" height="100%" fill="white"/><text x="1120.0" y="64" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#111">BẢNG PERSONA — CHỦ SÂN / NGƯỜI VẬN HÀNH</text><text x="1120.0" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#111">Hệ thống quản lý đặt sân thể thao</text><rect x="70" y="150" width="2100" height="95" fill="#f1f1f1"/><text x="96" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Nhóm người dùng</text><text x="476" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Hành vi hiện tại</text><text x="1116" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Khó khăn</text><text x="1616" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Nhu cầu</text><line x1="70" y1="245" x2="2170" y2="245" stroke="#111" stroke-width="1.8"/><text x="96" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Chủ sân / quản lý</text><text x="476" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Dùng sổ, Excel hoặc phần mềm; kiểm tra</text><text x="476" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">và đối soát tiền thủ công.</text><text x="1116" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Đối soát mất thời gian; ngại</text><text x="1116" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">công cụ mới khó học.</text><text x="1616" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Giao diện đơn giản; theo dõi lịch, đơn</text><text x="1616" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">và tiền thu thống nhất.</text><line x1="70" y1="383" x2="2170" y2="383" stroke="#111" stroke-width="1.8"/><text x="96" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#111">Người trực quầy</text><text x="476" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Ghi, cập nhật lịch và kiểm tra thông tin</text><text x="476" y="479" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">khách đến sân.</text><text x="1116" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Dễ nhầm khi nhiều người cùng</text><text x="1116" y="479" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">nhận đơn hoặc cập nhật chậm.</text><text x="1616" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">Thấy đúng lịch; tra cứu đơn và</text><text x="1616" y="479" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="start" fill="#111">check-in nhanh.</text><line x1="70" y1="521" x2="2170" y2="521" stroke="#111" stroke-width="1.8"/><rect x="70" y="150" width="2100" height="371" fill="none" stroke="#111" stroke-width="2.4"/><line x1="450" y1="150" x2="450" y2="521" stroke="#111" stroke-width="1.8"/><line x1="1090" y1="150" x2="1090" y2="521" stroke="#111" stroke-width="1.8"/><line x1="1590" y1="150" x2="1590" y2="521" stroke="#111" stroke-width="1.8"/><text x="70" y="579" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#111">Nguồn: Tổng hợp từ bảng persona được cung cấp; cần đối chiếu phiếu khảo sát gốc.</text><text x="70" y="627" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="#111">Lưu ý: Persona vận hành không đồng nghĩa bổ sung tài khoản nhân viên; thiết kế hiện chỉ có tài khoản chủ sân.</text><text x="70" y="675" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#111">Đây là mô tả người dùng và nhu cầu; không đồng nghĩa mọi mong muốn đều thuộc phạm vi triển khai.</text></svg>